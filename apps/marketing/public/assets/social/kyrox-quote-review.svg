    <text x="694" y="260" fill="#7cf0c1" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">slippage bound</text>
    <text x="36" y="326" fill="#85939c" font-family="Inter,Arial,sans-serif" font-size="14">REFERENCE PRICE</text>
